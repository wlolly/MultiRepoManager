<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>仓库管理系统 - E5 Warehouse Management</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        margin: 0;
        padding: 0;
        background-color: #f5f7fb;
      }
      .loading-message {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        text-align: center;
        padding: 0 20px;
      }
      .loader {
        border: 4px solid #f3f3f3;
        border-top: 4px solid #3498db;
        border-radius: 50%;
        width: 50px;
        height: 50px;
        animation: spin 2s linear infinite;
        margin-bottom: 20px;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <!-- 添加一个加载指示器和故障消息 -->
    <div id="loading-indicator" class="loading-message">
      <div class="loader"></div>
      <h2>正在加载仓库管理系统...</h2>
      <p id="loading-status">请稍候，我们正在连接服务器</p>
      <p><small>启动时间：<span id="startup-time"></span></small></p>
    </div>
    
    <div id="root"></div>
    
    <script>
      // 显示当前时间
      document.getElementById('startup-time').textContent = new Date().toLocaleString();
      
      // 强制显示加载指示器至少5秒钟
      const loadStartTime = Date.now();
      const LOADING_MIN_TIME = 5000; // 至少显示5秒加载指示器
      const loadingStatus = document.getElementById('loading-status');
      const loadingIndicator = document.getElementById('loading-indicator');
      
      // 显示数据库连接进度指示
      let progress = 0;
      const updateProgress = () => {
        progress++;
        if (loadingStatus) {
          if (progress <= 5) {
            loadingStatus.textContent = `正在连接数据库 (${progress}秒)...`;
          } else {
            loadingStatus.textContent = `数据库连接可能需要更长时间 (${progress}秒)...`;
            loadingStatus.style.color = '#ff9900';
          }
        }
      };
      
      // 每秒更新一次进度
      const progressInterval = setInterval(updateProgress, 1000);
      
      // 隐藏加载指示器的函数
      window.hideLoadingIndicator = function() {
        // 计算已经显示的时间
        const elapsedTime = Date.now() - loadStartTime;
        const remainingTime = Math.max(0, LOADING_MIN_TIME - elapsedTime);
        
        // 如果已显示不足5秒，则等待到5秒后再隐藏
        setTimeout(function() {
          clearInterval(progressInterval);
          if (loadingIndicator) {
            loadingIndicator.style.display = 'none';
          }
          console.log('加载指示器已隐藏，总显示时间:', (Date.now() - loadStartTime) / 1000, '秒');
        }, remainingTime);
      };
      
      // 5秒后检查React应用是否已加载
      setTimeout(function() {
        const rootElement = document.getElementById('root');
        
        if (rootElement && rootElement.children.length === 0) {
          if (loadingIndicator) {
            loadingIndicator.innerHTML = `
              <h2>应用加载遇到问题</h2>
              <p>您可以尝试刷新页面或检查控制台错误</p>
              <div style="margin-top: 20px; text-align: left; max-width: 600px;">
                <h3>调试信息：</h3>
                <ul>
                  <li>当前URL：${window.location.href}</li>
                  <li>当前时间：${new Date().toLocaleString()}</li>
                  <li>浏览器：${navigator.userAgent}</li>
                </ul>
                <p>如果问题持续，请联系管理员</p>
              </div>
            `;
          }
        }
      }, 10000); // 增加到10秒
    </script>
    
    <!-- React应用入口点 -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
