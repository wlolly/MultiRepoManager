<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>仓库管理系统 - E5 Warehouse Management</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        margin: 0;
        padding: 0;
        background-color: #f5f7fb;
      }
      .loading-message {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        text-align: center;
        padding: 0 20px;
      }
      .loader {
        border: 4px solid #f3f3f3;
        border-top: 4px solid #3498db;
        border-radius: 50%;
        width: 50px;
        height: 50px;
        animation: spin 2s linear infinite;
        margin-bottom: 20px;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <!-- 添加一个加载指示器和故障消息 -->
    <div id="loading-indicator" class="loading-message">
      <div class="loader"></div>
      <h2>正在加载仓库管理系统...</h2>
      <p id="loading-status">请稍候，我们正在连接服务器</p>
      <p><small>启动时间：<span id="startup-time"></span></small></p>
    </div>
    
    <div id="root"></div>
    
    <script>
      // 显示当前时间
      document.getElementById('startup-time').textContent = new Date().toLocaleString();
      
      // 5秒后检查React应用是否已加载
      setTimeout(function() {
        const loadingIndicator = document.getElementById('loading-indicator');
        const rootElement = document.getElementById('root');
        
        if (rootElement && rootElement.children.length === 0) {
          loadingIndicator.innerHTML = `
            <h2>应用加载遇到问题</h2>
            <p>您可以尝试刷新页面或检查控制台错误</p>
            <div style="margin-top: 20px; text-align: left; max-width: 600px;">
              <h3>调试信息：</h3>
              <ul>
                <li>当前URL：${window.location.href}</li>
                <li>当前时间：${new Date().toLocaleString()}</li>
                <li>浏览器：${navigator.userAgent}</li>
              </ul>
              <p>如果问题持续，请联系管理员</p>
            </div>
          `;
        }
      }, 5000);
    </script>
    
    <!-- React应用入口点 -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
